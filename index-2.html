<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BTC Live Monitor</title>
  <style>
    :root{--bg:#0b0e11;--card:#141a1f;--border:#1e2630;--text:#eaecef;--muted:#848e9c;--green:#0ecb81;--red:#f6465d;--yellow:#f0b90b}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
    .header h1{font-size:1.2rem;font-weight:700}
    .header h1 span{color:var(--yellow)}
    .status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
    .dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
    .binance{background:#12161b;border:1px solid #3a2e0a;border-radius:12px;padding:16px;text-align:center;margin-bottom:12px;position:relative}
    .binance::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--yellow);border-radius:12px 12px 0 0}
    .binance .lbl{font-size:.68rem;color:var(--yellow);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
    .binance .price{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
    .binance .sub{margin-top:6px;font-size:.82rem;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px}
    .card.up{border-left:3px solid var(--green)}
    .card.down{border-left:3px solid var(--red)}
    .card .name{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:600;margin-bottom:5px}
    .badge{font-size:.62rem;padding:2px 5px;border-radius:4px;background:#1e2630;color:var(--muted)}
    .badge.on{color:var(--green);background:rgba(14,203,129,.15)}
    .card .p{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
    .card .d{font-size:.78rem;margin-top:2px;font-variant-numeric:tabular-nums}
    .d.pos{color:var(--green)}.d.neg{color:var(--red)}.d.zero{color:var(--muted)}
    .spread{margin-top:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:.82rem}
    .spread h3{color:var(--muted);font-size:.78rem;margin-bottom:6px}
    .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)}
    .row:last-child{border-bottom:none}
    .footer{margin-top:16px;text-align:center;font-size:.68rem;color:var(--muted)}
    .tip{background:#1a2a1a;border:1px solid #2a4a2a;color:#a0d0a0;padding:8px;border-radius:8px;font-size:.75rem;margin-bottom:10px;text-align:center}
  </style>
</head>
<body>
  <div class="header">
    <h1>₿ <span>BTC</span> Live Monitor</h1>
    <div class="status"><div class="dot" id="dot"></div><span id="time">...</span></div>
  </div>

  <div class="tip" id="tip">Tunggu 10–15 detik… data sedang dihubungkan</div>

  <div class="binance">
    <div class="lbl">Binance • Referensi</div>
    <div class="price" id="bp">—</div>
    <div class="sub" id="bsub">Connecting...</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="spread">
    <h3>Spread vs Binance</h3>
    <div id="spread">Menunggu...</div>
  </div>

  <div class="footer">WebSocket • Tanpa API Key</div>

  <script>
    // Multiple endpoints for Binance to increase chance of connection
    const EX = {
      binance: {
        name: 'Binance',
        urls: [
          'wss://stream.binance.com:9443/ws/btcusdt@ticker',
          'wss://stream.binance.com:443/ws/btcusdt@ticker',
          'wss://data-stream.binance.vision/ws/btcusdt@ticker'
        ],
        parse: function(d){ return {price:+d.c, change:+d.P, vol:+d.v}; }
      },
      bybit: {
        name: 'Bybit',
        urls: ['wss://stream.bybit.com/v5/public/spot'],
        sub: {op:'subscribe', args:['tickers.BTCUSDT']},
        parse: function(d){
          if(d.topic!=='tickers.BTCUSDT'||!d.data) return null;
          return {price:+d.data.lastPrice, change:+d.data.price24hPcnt*100, vol:+d.data.volume24h};
        }
      },
      okx: {
        name: 'OKX',
        urls: ['wss://ws.okx.com:8443/ws/v5/public'],
        sub: {op:'subscribe', args:[{channel:'tickers', instId:'BTC-USDT'}]},
        parse: function(d){
          if(!d.data||!d.data[0]) return null;
          return {price:+d.data[0].last, change:0, vol:+d.data[0].vol24h};
        }
      },
      bitget: {
        name: 'Bitget',
        urls: ['wss://ws.bitget.com/v2/ws/public'],
        sub: {op:'subscribe', args:[{instType:'SPOT', channel:'ticker', instId:'BTCUSDT'}]},
        parse: function(d){
          if(!d.data||!d.data[0]) return null;
          var t=d.data[0];
          return {price:+t.lastPr, change:+(t.change24h||0)*100, vol:+t.baseVolume};
        }
      },
      gate: {
        name: 'Gate.io',
        urls: ['wss://api.gateio.ws/ws/v4/'],
        sub: {time:Math.floor(Date.now()/1000), channel:'spot.tickers', event:'subscribe', payload:['BTC_USDT']},
        parse: function(d){
          if(d.channel!=='spot.tickers'||d.event!=='update'||!d.result) return null;
          return {price:+d.result.last, change:+d.result.change_percentage, vol:+d.result.base_volume};
        }
      }
    };

    var prices = {};
    var live = {};
    var socks = {};
    var binanceP = null;
    var urlIdx = {};

    function money(n){
      if(n==null||isNaN(n)) return '—';
      return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    }

    function render(){
      if(prices.binance){
        binanceP = prices.binance.price;
        document.getElementById('bp').textContent = '$'+money(binanceP);
        var ch = prices.binance.change;
        document.getElementById('bsub').innerHTML = '<span style="color:'+(ch>=0?'var(--green)':'var(--red)')+'">'+(ch>=0?'+':'')+ch.toFixed(2)+'%</span>';
      }

      var html = '';
      var diffs = [];
      for(var k in EX){
        if(k==='binance') continue;
        var d = prices[k];
        var on = live[k];
        var cls = '';
        var diffTxt = '<span class="d zero">...</span>';
        if(d && binanceP){
          var diff = d.price - binanceP;
          var pct = (diff/binanceP)*100;
          var sign = diff>=0?'+':'';
          var c = Math.abs(diff)<0.5?'zero':(diff>0?'pos':'neg');
          diffTxt = '<span class="d '+c+'">'+sign+'$'+Math.abs(diff).toFixed(2)+'</span>';
          cls = Math.abs(diff)<0.5?'':(diff>0?'up':'down');
          diffs.push({name:EX[k].name, diff:diff});
        }
        html += '<div class="card '+cls+'"><div class="name">'+EX[k].name+'<span class="badge '+(on?'on':'')+'">'+(on?'LIVE':'...')+'</span></div><div class="p">'+(d?'$'+money(d.price):'—')+'</div>'+diffTxt+'</div>';
      }
      document.getElementById('grid').innerHTML = html;

      var sp = document.getElementById('spread');
      if(!diffs.length){
        sp.textContent = 'Menunggu data...';
      } else {
        diffs.sort(function(a,b){return b.diff-a.diff;});
        var maxs = diffs[0].diff - diffs[diffs.length-1].diff;
        var s = '';
        for(var i=0;i<diffs.length;i++){
          var x=diffs[i];
          var sg=x.diff>=0?'+':'';
          var cc=Math.abs(x.diff)<0.5?'zero':(x.diff>0?'pos':'neg');
          s += '<div class="row"><span>'+x.name+'</span><span class="d '+cc+'">'+sg+'$'+Math.abs(x.diff).toFixed(2)+'</span></div>';
        }
        s += '<div class="row" style="font-weight:700;margin-top:4px;border-top:1px solid var(--border);padding-top:6px"><span>Spread</span><span>$'+maxs.toFixed(2)+'</span></div>';
        sp.innerHTML = s;
      }

      document.getElementById('time').textContent = new Date().toLocaleTimeString('id-ID');
      document.getElementById('dot').classList.add('on');
      if(Object.keys(prices).length > 1) document.getElementById('tip').style.display='none';
    }

    function connect(key){
      var ex = EX[key];
      if(socks[key]) try{socks[key].close();}catch(e){}

      if(!urlIdx[key]) urlIdx[key]=0;
      var url = ex.urls[urlIdx[key] % ex.urls.length];
      urlIdx[key]++;

      try{
        var ws = new WebSocket(url);
        socks[key] = ws;

        ws.onopen = function(){
          live[key]=true;
          if(ex.sub) ws.send(JSON.stringify(ex.sub));
          render();
        };

        ws.onmessage = function(ev){
          try{
            var msg = JSON.parse(ev.data);
            var p = ex.parse(msg);
            if(p && p.price>0){
              prices[key]=p;
              live[key]=true;
              render();
            }
          }catch(e){}
        };

        ws.onclose = function(){
          live[key]=false;
          render();
          setTimeout(function(){connect(key);}, 2000 + Math.random()*2000);
        };

        ws.onerror = function(){try{ws.close();}catch(e){}};
      }catch(e){
        live[key]=false;
        setTimeout(function(){connect(key);}, 3000);
      }
    }

    // Start one by one with small delay to avoid overwhelming mobile browser
    var keys = Object.keys(EX);
    keys.forEach(function(k,i){
      setTimeout(function(){connect(k);}, i*800);
    });

    setInterval(render, 1500);
  </script>
</body>
</html>
